<!doctype html>
<!-- Source for docs/og-image.png (1200x630). Render with the same headless
     Chrome call as EQMirror/lp-site/make-og.sh. Redrawn on 2026-11-13 to match
     the earlier card, which had no source; only the price changed. -->
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1200px;height:630px;background:#000;overflow:hidden}
  body{position:relative;font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
  .glow{position:absolute;left:-118px;top:-50px;width:520px;height:520px;border-radius:50%;
        background:radial-gradient(circle,rgba(46,140,84,.55) 0%,rgba(30,90,55,.32) 38%,rgba(0,0,0,0) 68%)}
  .mark{position:absolute;left:90px;top:150px;width:104px;height:104px;border-radius:50%;box-sizing:border-box;
        border:13px solid transparent;background:linear-gradient(#000,#000) padding-box,linear-gradient(160deg,#a6edc4,#3fb46a) border-box}
  .dot{position:absolute;left:121px;top:181px;width:42px;height:42px;border-radius:50%;background:#effcf3}
  h1{position:absolute;left:88px;top:296px;margin:0;font-size:98px;font-weight:700;color:#f5f5f7;letter-spacing:-1px}
  .sub{position:absolute;left:90px;top:424px;margin:0;font-size:43px;color:#86868b}
  .foot{position:absolute;left:90px;top:514px;margin:0;font-size:28px;color:#86868b;word-spacing:2px}
</style></head><body>
  <div class="glow"></div><div class="mark"></div><div class="dot"></div>
  <h1>caps REC</h1>
  <p class="sub">Turn caps lock into your record button.</p>
  <p class="foot">macOS 15+ &nbsp;·&nbsp; No virtual audio driver &nbsp;·&nbsp; $13 one-time</p>
</body></html>
